name: kafka
display_name: Apache Kafka
description: Distributed event streaming. Runs single-node in KRaft mode.
category: messaging

image: apache/kafka:3.9.0
port: 9092

# StatefulSet is not optional for Kafka: a broker advertises its own address to
# clients, who reconnect to exactly that name. It must be stable across restarts,
# which is what a StatefulSet's per-pod DNS provides.
workload: statefulset

env:
  - name: KAFKA_NODE_ID
    value: "1"
  - name: KAFKA_PROCESS_ROLES
    value: broker,controller
  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
    value: 1@localhost:9093
  - name: KAFKA_LISTENERS
    value: PLAINTEXT://:9092,CONTROLLER://:9093
  # The advertised listener is the whole reason for the StatefulSet — clients
  # are told to reconnect here, so it must be the stable pod address.
  - name: KAFKA_ADVERTISED_LISTENERS
    value: PLAINTEXT://$(CABANA_POD_HOST):9092
  - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
    value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  - name: KAFKA_CONTROLLER_LISTENER_NAMES
    value: CONTROLLER
  - name: KAFKA_INTER_BROKER_LISTENER_NAME
    value: PLAINTEXT
  # Single node, so every replication factor is 1.
  - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    value: "1"
  - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
    value: "1"
  - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
    value: "0"
  - name: KAFKA_LOG_DIRS
    value: /var/lib/kafka/data
  # Fixed so a restart reuses the formatted storage instead of generating a new
  # id that would not match what is on disk.
  - name: CLUSTER_ID
    value: 4L6g3nShT-eMCtK--X86sw

storage: 5Gi
mount_path: /var/lib/kafka/data

connection:
  env_var: KAFKA_BROKERS
  # No auth in this single-node PLAINTEXT setup; it is reachable only inside the
  # cluster. The address is the stable pod host clients bootstrap against.
  template: "{{.PodHost}}:{{.Port}}"
